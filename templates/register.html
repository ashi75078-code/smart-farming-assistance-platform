{% extends "base.html" %}

{% block title %}
Create Account
{% endblock %}


{% block content %}

<div class="form-page">

    <div class="form-card">

        <div class="form-icon">
            🌱
        </div>

        <h1>Create Account</h1>

        <p>
            Join the Smart Farming platform.
        </p>


        <form method="POST">

            <label>Full Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >


            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
            >


            <button
                type="submit"
                class="btn primary-btn"
            >
                Create Account
            </button>

        </form>


        <p class="form-bottom">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
